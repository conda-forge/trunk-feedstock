context:
  name: trunk
  version: "0.22.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/trunk-rs/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 68bb132c7f827ed40d31948432dd4175f7d16aa745f175b9321987123d9d236b

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script: trunk --help

about:
  homepage: https://trunkrs.dev
  summary: Summary of the package.
  description: |
    Build, bundle & ship your Rust WASM application to the web.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  documentation: https://docs.rs/trunk
  repository: https://github.com/trunk-rs/trunk

extra:
  recipe-maintainers:
    - maurosilber
