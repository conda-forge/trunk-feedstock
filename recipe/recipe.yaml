context:
  name: trunk
  version: "0.22.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/trunk-rs/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b93e82dcb8cb3de8a6762d9d2df60a22b8e0db73c504edfcfabeb8017997bf1d

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script: trunk --help

about:
  homepage: https://trunkrs.dev
  summary: Summary of the package.
  description: |
    Build, bundle & ship your Rust WASM application to the web.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  documentation: https://docs.rs/trunk
  repository: https://github.com/trunk-rs/trunk

extra:
  recipe-maintainers:
    - maurosilber
